# Ortak reverse-proxy kurallari (80 ve 443 icin ayni)
# --- HTTP (port 80) : Cloudflare Flexible modunda buraya baglanir ---
server {
    listen 80;
    listen [::]:80;
    server_name business.softigo.com.tr;

    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# --- HTTPS (port 443) : Cloudflare Full modunda buraya baglanir ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name business.softigo.com.tr;

    ssl_certificate     /etc/ssl/certs/business-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/business-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50M;

    location /api/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
