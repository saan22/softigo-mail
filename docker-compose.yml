services:
  backend:
    build:
      context: ./backend
    restart: always
    # Gizli bilgiler ve ortam ayarlari backend/.env dosyasindan okunur (git'e girmez).
    # Ornek icin backend/.env.example dosyasina bakiniz.
    env_file:
      - ./backend/.env
    ports:
      # Sadece localhost'a baglanir; disariya erisim nginx uzerinden saglanir.
      - "127.0.0.1:3005:3005"
    networks:
      - softigo-network
    volumes:
      - ./backend-data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        # Kok dizindeki .env dosyasindan okunur (orn. https://business.softigo.com.tr)
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3005}
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - softigo-network

networks:
  softigo-network:
    driver: bridge
